[package]
name = "zeron"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zeron"
path = "src/main.rs"

[dependencies]
zeron-engine.workspace = true
zeron-rpc.workspace = true
zeron-ui.workspace = true
zeron-update.workspace = true
zeron-computer = { workspace = true, optional = true }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Device-local desktop perception/control (Cua driver). OFF by default:
# no service, no computer_* RPCs, no MCP subprocess, no run stamping.
computer = ["dep:zeron-computer", "zeron-engine/computer"]

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
